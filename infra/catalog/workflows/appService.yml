# GENERATED by infra/generate.ps1 from infra/infra.map.json (the deploy of {{key}}): don't edit it here.
# Change "deploy" of {{key}} in the map (or an environment's branch), then run .\infra\generate.ps1.
#
{{about}}
name: {{name}}

on:
//#if push
  push:
    branches: {{branches}}{{branchesNote}}
    paths:
{{paths}}
//#end
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to (infra/naming.json; the GitHub environment decides which branches may)'
        type: choice
        options: {{environments}}
        default: {{defaultEnvironment}}

permissions:
  contents: read

jobs:
//#if test
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: {{action:checkout}}
      - uses: {{action:setup-dotnet}}
        with:
          dotnet-version: '{{dotnet}}'
{{testStep}}

//#end
  # The environment this run deploys to: a manual run's choice, else the one whose
  # infra/environments/<env>.json names the pushed branch (infra/route.ps1).
  route:
    name: Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - uses: {{action:checkout}}
        with:
          sparse-checkout: infra
      - id: pick
        shell: pwsh
        # Through env, never pasted into the script: a branch name may hold quotes and semicolons.
        env:
          BRANCH: ${{ github.ref_name }}
          CHOSEN: ${{ inputs.environment }}
        run: ./infra/route.ps1 -Branch $env:BRANCH -Chosen $env:CHOSEN | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

  deploy:
    name: Deploy to App Service
    needs: [{{needs}}]
    if: needs.route.outputs.environment != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.route.outputs.environment }}
    # One deploy of this app per environment at a time: an older run can't finish after a newer one.
    concurrency:
      group: deploy-{{key}}-${{ needs.route.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC: no stored Azure secret
    steps:
      - name: Environment set up?
        id: env
        run: |
          if [ -n "${{ vars.{{appVar}} }}" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No {{appVar}} in this environment yet (.\infra\azure-setup.ps1): deploy skipped."; fi
      - uses: {{action:checkout}}
        if: steps.env.outputs.ready
      - uses: {{action:setup-dotnet}}
        if: steps.env.outputs.ready
        with:
          dotnet-version: '{{dotnet}}'
{{beforeBuild}}
      - name: Publish (linux-x64)
        if: steps.env.outputs.ready
{{stepEnv}}
        run: dotnet publish {{project}} -c Release -r linux-x64 --self-contained false{{publishArgs}} -o publish
//#if migrate
      # The database first (BA 4.4): the migrations of {{migrateProject}} as a bundle, built before the
      # Azure login (its token is short-lived) and run against this environment's database before the new
      # app runs. The connection: the environment's secret {{migrateVar}} when there is one (an older
      # app with a SQL login), else its variable of that name (Entra ID: Active Directory Default signs
      # in as the Azure login below).
      - name: Migration bundle
        if: steps.env.outputs.ready
{{stepEnv}}
        run: |
          if [ -f .config/dotnet-tools.json ]; then dotnet tool restore; else dotnet tool install --global dotnet-ef{{efVersion}}; fi
          dotnet ef migrations bundle --project {{migrateProject}} --startup-project {{migrateProject}} --configuration Release --self-contained --target-runtime linux-x64 --output efbundle --force
//#end
      - uses: {{action:azure-login}}
        if: steps.env.outputs.ready
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
//#if migrate
      - name: Migrate the database
        if: steps.env.outputs.ready
        env:
          CONNECTION_SECRET: ${{ secrets.{{migrateVar}} }}
          CONNECTION_VARIABLE: ${{ vars.{{migrateVar}} }}
        run: |
          connection="${CONNECTION_SECRET:-$CONNECTION_VARIABLE}"
          if [ -z "$connection" ]; then echo "::error::No {{migrateVar}} (variable or secret) in this environment (.\infra\azure-setup.ps1)."; exit 1; fi
          ConnectionStrings__{{migrateConnection}}="$connection" ./efbundle
//#end
      - uses: {{action:webapps-deploy}}
        if: steps.env.outputs.ready
        with:
          app-name: ${{ vars.{{appVar}} }}
          package: publish
//#if health
      # The app answers its health check ({{healthPath}}) after the deploy, or the run fails: a green
      # deploy of an app that doesn't start helps nobody.
      - name: Health check
        if: steps.env.outputs.ready
        run: |
          host=$(az webapp list --query "[?name=='${{ vars.{{appVar}} }}'].defaultHostName | [0]" -o tsv)
          url="https://$host{{healthPath}}"
          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$url" || true)
            case "$code" in
              2??) echo "$url: $code"; exit 0 ;;
              # Up but not open to the runner (Easy Auth, locked to Front Door): it answers, that's enough here.
              401|403|302|307) echo "::warning::$url answered $code: the app is up, but the runner can't see its health check"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::$url answered $code after 5 minutes"; exit 1
//#end
{{afterDeploy}}
