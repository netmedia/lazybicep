# GENERATED by infra/generate.ps1 from infra/infra.map.json (the deploy of {{key}}): don't edit it here.
# Change "deploy" of {{key}} in the map (or an environment's branch), then run .\infra\generate.ps1.
#
{{about}}
name: {{name}}
# A run the setup's step First image dispatches is titled "<workflow> <nonce>", so that start finds its own run
# (never just the newest one); every other run is titled with the workflow's name.
run-name: ${{ inputs.nonce && format('{0} {1}', github.workflow, inputs.nonce) || github.workflow }}

on:
//#if push
  push:
    branches: {{branches}}{{branchesNote}}
    paths:
{{paths}}
//#end
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to (infra/naming.json; the GitHub environment decides which branches may)'
        type: choice
        options: {{environments}}
        default: {{defaultEnvironment}}
      push-only:
        description: 'Only build and push the image (the setup''s step First image deploys it with main.bicep)'
        type: boolean
        default: false
      nonce:
        description: 'Set by the setup''s step First image to find its run (leave empty)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
//#if test
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: {{action:checkout}}
{{testSetup}}
{{testStep}}

//#end
  # The environment this run deploys to: a manual run's choice, else the one whose
  # infra/environments/<env>.json names the pushed branch (infra/route.ps1).
  route:
    name: Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - uses: {{action:checkout}}
        with:
          sparse-checkout: infra
      - id: pick
        shell: pwsh
        # Through env, never pasted into the script: a branch name may hold quotes and semicolons.
        env:
          BRANCH: ${{ github.ref_name }}
          CHOSEN: ${{ inputs.environment }}
        run: ./infra/route.ps1 -Branch $env:BRANCH -Chosen $env:CHOSEN | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

  # The image is built on the runner, pushed to the registry tagged with the commit (AcrPush) and only the app's
  # image is changed (Container Apps Contributor): its settings, secrets, probes and sign-in come from main.bicep.
  deploy:
    name: Deploy to Container Apps
    needs: [{{needs}}]
    if: needs.route.outputs.environment != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.route.outputs.environment }}
    # One deploy of this app per environment at a time: an older run can't finish after a newer one.
    concurrency:
      group: deploy-{{key}}-${{ needs.route.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC: no stored Azure secret
    # The environment's values through env, never pasted into a script.
    env:
      APP_NAME: ${{ vars.{{appVar}} }}
      APP_GROUP: ${{ vars.{{groupVar}} }}
      REGISTRY_NAME: ${{ vars.{{registryVar}} }}
      IMAGE: {{repository}}:${{ github.sha }}
    steps:
      - name: Environment set up?
        id: env
        run: |
          if [ -n "$APP_NAME" ] && [ -n "$APP_GROUP" ] && [ -n "$REGISTRY_NAME" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No {{appVar}}, {{groupVar}} or {{registryVar}} in this environment yet (.\infra\azure-setup.ps1): deploy skipped."; fi
      - uses: {{action:checkout}}
        if: steps.env.outputs.ready
{{beforeBuild}}
      - name: Build the image
        if: steps.env.outputs.ready
        env:
          DOCKERFILE: {{dockerfile}}
          CONTEXT: {{context}}
{{buildEnv}}
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE"{{buildSecrets}} "$CONTEXT"
      - uses: {{action:azure-login}}
        if: steps.env.outputs.ready
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push the image
        id: push
        if: steps.env.outputs.ready
        run: |
          server="$(echo "$REGISTRY_NAME" | tr '[:upper:]' '[:lower:]')$(az cloud show --query suffixes.acrLoginServerEndpoint -o tsv)"
          az acr login --name "$REGISTRY_NAME"
          docker tag "$IMAGE" "$server/$IMAGE"
          docker push "$server/$IMAGE"
          echo "image=$server/$IMAGE" >> "$GITHUB_OUTPUT"
//#if signIn
      # The app trusts the platform's sign-in: its code never runs before the sign-in exists.
      - name: Sign-in in front of the app?
        if: steps.env.outputs.ready && !inputs.push-only
        run: |
          enabled=$(az containerapp auth show --name "$APP_NAME" --resource-group "$APP_GROUP" --query "platform.enabled && identityProviders.azureActiveDirectory.enabled" -o tsv 2>/dev/null || true)
          if [ "$enabled" != "true" ]; then
            echo "::error::$APP_NAME has no Entra ID sign-in yet: its image is deployed only behind it (.\infra\azure-setup.ps1: step Sign-in app registration, then a start)."; exit 1
          fi
//#end
      # The image is only pushed when the setup asks for it (its step First image deploys it with main.bicep).
      - name: Pushed only
        if: steps.env.outputs.ready && inputs.push-only
        env:
          PUSHED: ${{ steps.push.outputs.image }}
        run: echo "::notice::$PUSHED pushed; the setup deploys it (.\infra\azure-setup.ps1, step First image)."
      # A new app runs the placeholder (its port 80, no probes): its first image goes in with main.bicep, which
      # sets them, not with an image change alone.
      - name: First image?
        if: steps.env.outputs.ready && !inputs.push-only
        env:
          PUSHED: ${{ steps.push.outputs.image }}
        run: |
          current=$(az containerapp show --name "$APP_NAME" --resource-group "$APP_GROUP" --query "properties.template.containers[0].image" -o tsv)
          # Any tag or digest of the placeholder (an app made by an older kit runs it by tag).
          case "$current" in mcr.microsoft.com/k8se/quickstart|mcr.microsoft.com/k8se/quickstart:*|mcr.microsoft.com/k8se/quickstart@*) is_placeholder=yes ;; *) is_placeholder= ;; esac
          if [ -n "$is_placeholder" ]; then
            echo "::error::$APP_NAME still runs the placeholder. $PUSHED is pushed: the setup's step First image (.\infra\azure-setup.ps1) deploys the first image with main.bicep, then this workflow deploys every later one."; exit 1
          fi
      - name: Deploy the image
        if: steps.env.outputs.ready && !inputs.push-only
        env:
          PUSHED: ${{ steps.push.outputs.image }}
        run: az containerapp update --name "$APP_NAME" --resource-group "$APP_GROUP" --container-name {{containerName}} --image "$PUSHED" --output none
      # The new revision is ready{{healthNote}} within 5 minutes, or the run fails: a green deploy
      # of an app that doesn't start helps nobody. A hard deadline: each call gets only the time left, and the
      # step's timeout ends anything that still hangs.
      - name: Health check
        if: steps.env.outputs.ready && !inputs.push-only
        timeout-minutes: 6
        env:
          HEALTH_PATH: {{healthPath}}
        run: |
          deadline=$(( $(date +%s) + 300 )); latest=; code=
          while left=$(( deadline - $(date +%s) )); [ "$left" -gt 0 ]; do
            state=$(timeout "$left" az containerapp show --name "$APP_NAME" --resource-group "$APP_GROUP" --query "{latest: properties.latestRevisionName, ready: properties.latestReadyRevisionName, fqdn: properties.configuration.ingress.fqdn}" -o json 2>/dev/null) || state='{}'
            latest=$(echo "$state" | jq -r '.latest // empty' 2>/dev/null || true); ready=$(echo "$state" | jq -r '.ready // empty' 2>/dev/null || true); fqdn=$(echo "$state" | jq -r '.fqdn // empty' 2>/dev/null || true)
            if [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              if [ -z "$HEALTH_PATH" ]; then echo "$latest is ready"; exit 0; fi
              left=$(( deadline - $(date +%s) ))
              if [ "$left" -gt 0 ]; then
                code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time "$(( left < 20 ? left : 20 ))" "https://$fqdn$HEALTH_PATH" || true)
                case "$code" in 2??) echo "https://$fqdn$HEALTH_PATH: $code ($latest)"; exit 0 ;; esac
              fi
            fi
            left=$(( deadline - $(date +%s) ))
            if [ "$left" -gt 0 ]; then sleep "$(( left < 10 ? left : 10 ))"; fi
          done
          echo "::error::$APP_NAME: revision ${latest:-(unknown)} not ready$(if [ -n "$HEALTH_PATH" ]; then echo " or $HEALTH_PATH answered ${code:-nothing}"; fi) after 5 minutes"; exit 1
{{afterDeploy}}
